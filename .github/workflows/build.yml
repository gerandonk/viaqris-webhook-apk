name: Build Native ViaQRIS Webhook APK

on:
  push:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Slim Release APK
        run: gradle assembleRelease --no-daemon
        
      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk ViaQRIS.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViaQRIS-Webhook-Native-APK
          path: ViaQRIS.apk
